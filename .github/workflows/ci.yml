name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.100.0 --profile minimal --no-self-update
      - run: rustup component add rustfmt clippy --toolchain 1.100.0
      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cargo fmt --all -- --check
      - run: cargo check --locked
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
  build-artifact:
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.100.0 --profile minimal --no-self-update
      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cargo build --release --locked --bin nexora-mcp
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: nexora-mcp-0.4.0
          path: target/release/nexora-mcp
          if-no-files-found: error
          retention-days: 7
  image:
    needs: [quality, build-artifact]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nexora-mcp-0.4.0
          path: image-context
      - run: chmod +x image-context/nexora-mcp
      - name: Build runtime image
        run: docker build --build-context worker-artifact=image-context --tag nexora-mcp:ci .
      - name: Smoke-test runtime
        run: |
          docker run --rm nexora-mcp:ci --help > /tmp/nexora-mcp-help.txt
          grep -q 'nexora-mcp' /tmp/nexora-mcp-help.txt
          docker run --rm --entrypoint /bin/sh nexora-mcp:ci -ec 'test "$(id -u)" -ne 0 && test -x /usr/local/bin/nexora-mcp'
      - name: Publish image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          test -n "$GHCR_TOKEN" || { echo "GHCR_TOKEN is not configured" >&2; exit 1; }
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker tag nexora-mcp:ci "ghcr.io/${GITHUB_REPOSITORY}:0.4.0"
          docker push "ghcr.io/${GITHUB_REPOSITORY}:0.4.0"
